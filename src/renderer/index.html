<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lares</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: lares:; connect-src 'self' lares:"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f1ea;
      }
      /* One canvas, one WebGL context: A/B splits it into two slots (002-D2).
         The wrapper is what pixi sizes to, so the dev panel can reserve its
         strip without the stages rendering underneath it. */
      #stage-wrap {
        position: absolute;
        inset: 0;
      }
      #stage {
        width: 100%;
        height: 100%;
      }
      .boot-error {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 80%;
        padding: 16px 20px;
        background: #fff3f3;
        border: 1px solid #d66;
        border-radius: 8px;
        color: #922;
        font: 14px/1.5 system-ui, sans-serif;
        white-space: pre-wrap;
      }
      #dev-panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 260px;
        overflow-y: auto;
        background: rgba(20, 20, 24, 0.85);
        color: #ddd;
        font: 11px/1.6 monospace;
        padding: 8px;
      }
      #dev-panel label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #dev-panel label span {
        flex: 0 0 110px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #dev-panel input[type='range'] {
        flex: 1;
        min-width: 0;
      }
      #dev-panel button,
      #dev-panel select {
        margin: 2px 4px 6px 0;
        font: inherit;
      }
    </style>
  </head>

  <body>
    <div id="stage-wrap"><canvas id="stage"></canvas></div>
    <script src="./live2dcubismcore.min.js"></script>
    <script type="module" src="./src/stage/index.ts"></script>
  </body>
</html>
