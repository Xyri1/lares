interface:
  display_name: "Calibrate Lar"
  short_description: "Map a Lar's expressions to the six cues"
  default_prompt: "Use $lares:calibrate-lar to finish setting up the expressions of the Lar I just imported."

dependencies:
  tools:
    - type: "mcp"
      value: "lares"
      description: "Lares desktop companion MCP server"
      transport: "streamable_http"
      url: "http://127.0.0.1:21473/v1/mcp"

policy:
  allow_implicit_invocation: false
